[tox]
envlist = py313-numpy, pypy311, py310, py311, py312, py313, py314,
          py313-twisted-latest,
          linters3, sphinx

[gh-actions]
python =
       3.10: py310
       3.11: py311
       3.12: py312
       3.13: py313, linters3, sphinx, py313-numpy, py313-twisted-latest
       3.14: py314
       pypy3.11: pypy311

[testenv]
commands =
    pip install .[test]
    pip list
    {envpython} -m pytest

## No Twisted ##
[testenv:py313-numpy]
basepython = python3.13
deps = numpy
       dask[bag]

# Install all the things in at least one environment
[testenv:py311]
basepython = python3.11
deps = cffi
       dask[bag]
       dask[distributed]
       dask[pandas]
       numpy
       pandas
       polars
       pydantic

[testenv:py313-twisted-latest]
basepython = python3.13
deps = Twisted

[testenv:pypy3]
basepython = pypy3
deps =

# Other validation:
[testenv:linters3]
deps = pyflakes
       black
       flake8
basepython = python3.13
commands =
         pyflakes eliot
         black --check --target-version=py310 eliot

[testenv:sphinx]
deps = sphinx
       sphinx_rtd_theme
basepython = python3.13
commands =
    sphinx-build -b html docs/source/ docs/_build/html
